<main class="admin-page"><header class="admin-heading"><div><span class="eyebrow">CUSTOMERS</span><h1>Users</h1><p>Registered ByteZone accounts.</p></div><button class="btn" (click)="load()">Refresh</button></header>@if(error()){<div class="state error">{{error()}}</div>}<section class="panel">@if(loading()){<div class="state">Loading users...</div>} @else {<div class="list">@for(u of users();track u._id){<div class="list-row"><div><strong>{{u.name}}</strong><span>{{u.email}}</span><small>Joined {{u.createdAt|date:'mediumDate'}}</small></div><strong class="role" [class.admin]="u.role==='admin'">{{u.role}}</strong></div>}</div>}</section></main>
